services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      # Bind to localhost only: reachable for host-run tests, never the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Reach Postgres by service name; overrides any localhost value in .env.
      DATABASE_URL: postgresql://cortex:cortex@postgres:5432/cortex
      HF_HOME: /hf
    ports:
      # Bind to localhost only. Locally the Vite dev proxy reaches it here; in
      # production Caddy reaches it over the compose network (see docker-compose.prod.yml).
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app        # live source, bundled fixture, and .env (for DEEPSEEK_API_KEY)
      - hfcache:/hf   # BGE model cache: downloaded once, reused every run

volumes:
  pgdata:
  hfcache:
