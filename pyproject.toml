[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "sentence-transformers>=3,<6",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real Postgres+pgvector and the bge model (run in CI)"]
